<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calaculator</title>
  <link rel="stylesheet" href="style.css">

</head>
<body>

  <header>
    <div class="heading">My Calculator</div>
  </header>
    

  

  <br>
  <br>
  <br>
  <br>


  <div class="calculator">
    <p class="js-calculation"></p>

    <p>
      <button  class="black" onclick="updateCalculation('1');">1</button>
      <button class="black" onclick="updateCalculation('2');">2</button>
      <button class="black" onclick="updateCalculation('3');">3</button>
      <button class="yellow" 
      onclick="updateCalculation(' + ');">+</button>
    </p>

    <p>
      <button class="black" onclick="updateCalculation('4');">4</button>
      <button class="black" onclick="updateCalculation('5');">5</button>
      <button class="black" onclick="updateCalculation('6');">6</button>
      <button class="yellow" 
      onclick="updateCalculation(' - ');">-</button>
    </p>

    <p>
      <button class="black" onclick="updateCalculation('7');">7</button>
      <button class="black" onclick="updateCalculation('8');">8</button>
      <button class="black" onclick="updateCalculation('9');">9</button>
      <button class="yellow" 
      onclick="updateCalculation(' * ');">*</button>
    </p>

    <p>
      <button class="black" onclick="updateCalculation('0');">0</button>
      <button class="black" onclick="updateCalculation('.');">.</button>
      <button class="black" onclick="calculation=eval(calculation);
        displayCalculation();
        localStorage.setItem('calculation',calculation);">=</button>
      <button class="yellow" 
      onclick="updateCalculation(' / ');">/</button>
    </p>

    <p>
      
    <button class="blue" onclick="backSpace();">⌫</button>

    <button class="blue" onclick="calculation='';
      displayCalculation();
      localStorage.setItem('calculation',calculation);">
      Clear
    </button>
    </p>
  </div>

  

  <script src="calc.js">


  </script> 


  
</body>
</html>
